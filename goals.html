<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Goals | Daily Habit & Goal Tracker</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Daily Habits & Goal Tracker</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="habits.html">Habits</a>
            <a href="goals.html">Goals</a>
            <a href="progress.html">Progress</a>
            <a href="add-habit.html">Add Habit</a>
        </nav>
    </header>


    <main>

        <section>
            <h2>My Goals</h2>

            <div id="goalContainer" class="habit-container">
                <!-- Goals will be displayed here -->
            </div>
        </section>


        <section>
            <h2>Add New Goal</h2>

            <form id="goalForm">

                <label for="goalName">
                    Goal Name
                </label>

                <br><br>

                <input
                    type="text"
                    id="goalName"
                    placeholder="Enter your goal"
                >

                <br><br>

                <button type="submit">
                    Add Goal
                </button>

            </form>
        </section>


        <section>

            <h2>Goal Progress</h2>

            <div class="progress-bar">

                <div
                    id="goalProgressFill"
                    class="progress-fill">
                </div>

            </div>

            <p
                id="goalProgressText"
                class="progress-text">
                0% Completed
            </p>

        </section>

    </main>


    <footer>
        <p>© 2026 Daily Habits & Goal Tracker</p>
    </footer>


    <script src="js/script.js"></script>

</body>

</html>
